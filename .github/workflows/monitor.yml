name: Monitor de mercado

on:
  schedule:
    # O acionamento principal vem de fora (n8n, via workflow_dispatch), pois o
    # GitHub descarta/atrasa a maioria dos agendamentos. Este cron fica de reserva.
    # Cron do GitHub Actions é sempre em UTC (Brasília = UTC-3).
    # Minutos 7 e 37, de 12h a 20h UTC, seg–sex = 09:07 a 17:37 em Brasília.
    # Minutos "quebrados" porque o GitHub atrasa/descarta mais nos redondos.
    # Mesmo que o GitHub atrase uma rodada para fora do expediente, o código
    # confere o horário (config/geral.yaml) e não envia nada.
    - cron: "7,37 12-20 * * 1-5"
  workflow_dispatch:      # permite rodar manualmente pela aba "Actions" no GitHub
    inputs:
      ignorar_horario:
        description: "Ignorar horário comercial (TESTE: e-mail só para o administrador, estado não é salvo)"
        type: boolean
        default: false

permissions:
  contents: write   # necessário para persistir o estado (histerese) no repositório

# Uma rodada por vez: se o n8n e o cron de reserva coincidirem, a segunda
# espera a primeira terminar (e lê o estado já atualizado por ela).
concurrency:
  group: monitor-de-mercado
  cancel-in-progress: false

jobs:
  monitorar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # versão mais recente (inclui o estado salvo pela rodada anterior)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar monitoramento
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_NOME_EXIBICAO: ${{ secrets.EMAIL_NOME_EXIBICAO }}
          AWESOMEAPI_TOKEN: ${{ secrets.AWESOMEAPI_TOKEN }}
          IGNORAR_HORARIO: ${{ inputs.ignorar_horario }}
        run: python main.py

      - name: Persistir estado do monitoramento (histerese/anti-spam)
        run: |
          git config user.name "alerta-mercado-bot"
          git config user.email "actions@users.noreply.github.com"
          git add logs/estado.json
          git diff --staged --quiet || git commit -m "Atualiza estado do monitoramento [skip ci]"
          git pull --rebase
          git push

      - name: Guardar log da execução
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-execucao-${{ github.run_id }}
          path: logs/alerta_mercado.log
          retention-days: 30
