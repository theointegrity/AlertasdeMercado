# ============================================================
# INDICADORES MONITORADOS
# ============================================================
# Para ALTERAR um gatilho: edite o número em "gatilho" e salve.
# Para DESATIVAR um indicador sem apagar: mude "ativo" para false.
# Para ADICIONAR um novo indicador do mesmo tipo (ex.: outro título
# do Tesouro): copie um bloco inteiro, mude "id" para algo único e
# ajuste os campos.
#
# Campos:
#   id            identificador único (usado no controle de estado)
#   ativo         true/false
#   conector      qual "fonte" usar: dolar | tesouro
#   frequencia    intradiario (consulta toda execução, ~a cada 15 min)
#   gatilho       valor que dispara o alerta
#   operador      ">=" | "<=" | ">" | "<"
#   rotulo        nome amigável exibido no e-mail
#   parametros    específicos de cada conector (ver conectores/*.py)
#
# Anti-spam: no máximo 1 e-mail por indicador por dia, mesmo que ele
# dispare em várias consultas seguidas no mesmo dia. No dia seguinte,
# se ainda estiver disparando, um novo alerta pode ser enviado.
# ============================================================

- id: dolar
  ativo: true
  conector: dolar
  frequencia: intradiario
  gatilho: 5.10
  operador: "<="
  rotulo: "Dólar · USD/BRL"
  parametros: {}

- id: ntnb2040
  ativo: true
  conector: tesouro
  frequencia: intradiario
  gatilho: 8.00
  operador: ">="
  rotulo: "NTN-B · Tesouro IPCA+ 2040"
  parametros:
    tipo: "Tesouro IPCA+"
    ano_venc: 2040
    taxa_ref: compra
    unidade: ipca

- id: ltn2029
  ativo: true
  conector: tesouro
  frequencia: intradiario
  gatilho: 14.80
  operador: ">="
  rotulo: "LTN · Tesouro Prefixado 2029"
  parametros:
    tipo: "Tesouro Prefixado"
    ano_venc: 2029
    taxa_ref: compra
    unidade: prefixado
